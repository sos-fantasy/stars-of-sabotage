name: Social schedule

# Hourly, after the data update (:07). Builds every card that is due now
# (pipeline/social/schedule.py). social/config.yml decides per card type:
# dry-run cards are saved to social/outbox/ for review; live cards are also
# hosted on the site and posted to Instagram and Facebook.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      card:
        description: "Build one card by ID now (e.g. game-2026_10_WAS_NYG), ignoring the schedule"
        required: false

permissions:
  contents: write

concurrency:
  group: social-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      CARD: ${{ inputs.card }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the live site data
        uses: actions/checkout@v5
        with:
          ref: deploy
          path: live
          sparse-checkout: |
            data/meta.json
            data/scores-*.json
            data/defense-*.json
            data/games-*.json
            assets/social
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml pillow playwright

      - name: What is due
        id: plan
        run: |
          if [ -n "$CARD" ]; then echo "due=1" >> "$GITHUB_OUTPUT"; else python pipeline/social/run.py build --data live/data --plan; fi

      - name: Build due cards
        id: build
        if: steps.plan.outputs.due != '0' || hashFiles('social/pending.json') != ''
        run: |
          python -m playwright install --with-deps chromium > /dev/null
          if [ -n "$CARD" ]; then python pipeline/social/run.py build --data live/data --card "$CARD"; else python pipeline/social/run.py build --data live/data; fi

      - name: Save results to the repo
        if: always() && steps.build.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A social site/assets/social/auto
          if ! git diff --cached --quiet; then
            git commit -m "Social: cards built $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
          fi

      - name: Host live images on the site
        if: hashFiles('social/pending.json') != ''
        run: |
          mkdir -p live/assets/social/auto
          cp site/assets/social/auto/*.jpg live/assets/social/auto/
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/social/auto
          if ! git diff --cached --quiet; then
            git commit -m "Social: host card images"
            for i in 1 2 3; do git pull --rebase -q origin deploy && git push -q origin HEAD:deploy && break; sleep 10; done
          fi

      - name: Post live cards
        if: hashFiles('social/pending.json') != ''
        run: python pipeline/social/run.py publish

      - name: Save the posting log
        if: always() && hashFiles('social/posted.json') != ''
        run: |
          git add -A social
          if ! git diff --cached --quiet; then
            git commit -m "Social: posting log $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
          fi
