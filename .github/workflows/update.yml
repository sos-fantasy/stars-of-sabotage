name: Update scores

# GitHub cron is UTC and ignores daylight saving. It fires hourly at :07
# (top-of-hour runs get delayed) and pipeline/schedule.py decides, in
# Eastern time, whether this hour has work to do.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild every season from 1999 (use after a scoring rule change)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "config/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out the deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scoring tests
        run: python -m pytest -q tests

      - name: Fetch, score, and build
        id: build
        env:
          SOS_NOINDEX: "0"   # live at starsofsabotage.com (moved out of /preview October 21, 2026)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude's weekly review write-up
          FORCE: ${{ github.event_name != 'schedule' && '--force' || '' }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
        run: python pipeline/run.py --out dist --prev deploy $FORCE $BACKFILL

      - name: Publish to the deploy branch
        if: steps.build.outputs.ran == 'true'
        run: |
          rsync -a --delete --exclude .git dist/ deploy/
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -q -m "Data update $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git push origin deploy
          fi
