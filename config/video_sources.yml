# Feeds checked for the weekly worst-plays video (brief section 10).
# Each source is a YouTube playlist (playlist_id) or a whole channel (channel_id).
# The pipeline reads the public RSS feed and keeps uploads whose title matches
# title_pattern (a case-insensitive regular expression; leave it out to keep everything).
# A feed lists only about 15 videos; anything found earlier is kept from past runs.
# The same video found in both feeds is stored once.
# play_on_site: false shows a thumbnail that opens YouTube instead of a player on our
# page. Set Oct 18, 2026: NFL Rush videos carry an NFL claim that blocks playback on
# other sites ("This video contains content from NFL, who has blocked it from display
# on this website"). YouTube's oEmbed check still reports them as embeddable, so the
# pipeline cannot detect this block on its own.
play_on_site: false

sources:
  # "The Worst NFL Plays - 2026 Season" by NFL Rush (owner's pick, October 18, 2026).
  # Newest first, so new weeks stay inside the feed's 15-video window.
  - name: NFL Rush 2026 worst plays playlist
    playlist_id: PLFGkcMzJRQbA
  # Backup: NFL Rush's channel uploads, filtered by title, in case the playlist lags.
  - name: NFL Rush channel
    channel_id: UC_vl8cSXLBi1tVegCKMRtTw
    title_pattern: "worst plays"
  # Past seasons. A source with `season` keeps only titles that name a week
  # ("The WORST Plays of Week 5"); playoff and season-recap videos are skipped.
  # Each feed lists the first 15 videos of the playlist; add any it misses
  # to videos_manual.csv.
  - name: NFL Rush 2024 worst plays playlist
    playlist_id: PLzvClh0aNo0FtUAmwsdb691I4MGZ-2kCK
    season: 2024
  - name: NFL Rush 2023 worst plays playlist
    playlist_id: PLzvClh0aNo0HY3YvwhXVrHU-tsa5XuZEu
    season: 2023
