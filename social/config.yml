# Social posting switches. Owner decisions, November 15, 2026.
# Game and Wreckage cards set to live by the owner on November 15, 2026 (week 10).
#
# mode per card type:
#   off      never builds
#   dry-run  builds the card and captions into social/outbox/<id>/ for review; posts nothing
#   live     builds, hosts the JPEG on starsofsabotage.com, then posts
# Flip a type to live only after its dry runs look right.
mode:
  game: live
  wreckage: live

platforms: [instagram, facebook]

# Pinterest, route 1: RSS feed at https://starsofsabotage.com/assets/social/auto/pinterest.xml
# Every live card is added to the feed; Pinterest reads it within 24 hours (no API approval needed).
# Turn this off if Pinterest gets cards another way (Instagram link or the API), or Pins will double.
pinterest_feed: true
